name: Deploy

# Deploy path B (locked): Terraform owns infra once; Actions builds/pushes the
# image tagged with github.sha and force-new-deploys the ECS service.
# Required GitHub secrets/vars:
#   secrets.AWS_DEPLOY_ROLE_ARN  — OIDC role ARN from terraform output github_actions_role_arn
#   vars.AWS_REGION              — default ca-central-1
#   vars.ECR_REPOSITORY          — default ledgerlift-api
#   vars.ECS_CLUSTER             — default ledgerlift
#   vars.ECS_SERVICE             — default ledgerlift-api

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ca-central-1' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'ledgerlift-api' }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'ledgerlift' }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE || 'ledgerlift-api' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Lint and test
        working-directory: app
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - name: Build and push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}" -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Render and register task definition
        id: taskdef
        env:
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --query 'taskDefinition' > /tmp/td.json
          python3 - <<'PY'
          import json, os
          with open("/tmp/td.json") as f:
              td = json.load(f)
          for key in [
              "taskDefinitionArn", "revision", "status", "requiresAttributes",
              "compatibilities", "registeredAt", "registeredBy", "deregisteredAt",
          ]:
              td.pop(key, None)
          image = os.environ["IMAGE_URI"]
          for c in td["containerDefinitions"]:
              if c.get("name") == "api":
                  c["image"] = image
          with open("/tmp/td-new.json", "w") as f:
              json.dump(td, f)
          PY
          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/td-new.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "arn=$NEW_ARN" >> "$GITHUB_OUTPUT"

      - name: Rolling ECS deploy
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "${{ steps.taskdef.outputs.arn }}" \
            --force-new-deployment

      # Idle lab: terraform destroy. Never leave ALB + ECS up overnight.
